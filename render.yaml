services:
  - type: web
    name: milan-enterprises
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    # Schema setup runs as a pre-deploy job in the service environment, where
    # the managed Postgres connection is guaranteed to be available.
    # drizzle-kit migrate is fully non-interactive (unlike push), so it is safe
    # for an unattended deploy. Idempotent: already-applied migrations are skipped.
    preDeployCommand: node scripts/migrate.mjs
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: milan-enterprises-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: SEED_SECRET
        generateValue: true
      - key: NPM_CONFIG_FUND
        value: "false"
      - key: NPM_CONFIG_AUDIT
        value: "false"
      - key: NEXT_PUBLIC_SITE_URL
        fromService:
          name: milan-enterprises
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: milan-enterprises-db
    plan: 0.1c-256mb
